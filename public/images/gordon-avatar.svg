<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Gordon illustrated avatar</title>
  <desc id="desc">A stylized illustrated portrait with short black hair and glasses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c16"/>
      <stop offset="1" stop-color="#060806"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ceb9"/>
      <stop offset="1" stop-color="#938d7e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c7aa"/>
      <stop offset="1" stop-color="#c98f73"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#62ff70" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="24" y="24" width="752" height="752" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="800" fill="url(#bg)"/>
    <rect width="800" height="800" fill="url(#grid)"/>
    <circle cx="615" cy="175" r="128" fill="#62ff70" opacity=".06" filter="url(#glow)"/>
    <path d="M70 610C150 530 225 520 318 538h164c93-18 168-8 248 72v190H70z" fill="url(#jacket)"/>
    <path d="M318 534l82 65 82-65 38 266H280z" fill="#111412"/>
    <path d="M335 503h130v104c-43 34-87 34-130 0z" fill="url(#skin)"/>

    <path d="M242 305c0-116 67-190 158-190s158 74 158 190v115c0 121-71 199-158 199s-158-78-158-199z" fill="url(#skin)"/>
    <path d="M244 348c-24-79-11-180 58-234 52-41 142-49 201-8 57 40 76 112 57 186-20-18-39-45-47-82-61 33-141 39-238 12-1 47-10 88-31 126z" fill="#111413"/>
    <path d="M265 228c49-90 171-125 270-50-90-25-180 16-270 50z" fill="#252b27" opacity=".8"/>
    <path d="M243 354c-34-8-50 16-41 65 8 44 28 62 57 54zM557 354c34-8 50 16 41 65-8 44-28 62-57 54z" fill="#d99d80"/>

    <g fill="none" stroke="#27322a" stroke-width="12">
      <rect x="270" y="344" width="112" height="72" rx="23"/>
      <rect x="418" y="344" width="112" height="72" rx="23"/>
      <path d="M382 372c12-9 24-9 36 0M258 357l-22-8M542 357l22-8"/>
    </g>
    <g fill="#1d231f">
      <ellipse cx="335" cy="377" rx="10" ry="14"/>
      <ellipse cx="465" cy="377" rx="10" ry="14"/>
    </g>
    <path d="M395 390c-6 29-7 49-1 60 9 9 22 11 35 4" fill="none" stroke="#ad715d" stroke-width="7" stroke-linecap="round"/>
    <path d="M350 500c32 25 68 28 103 0" fill="none" stroke="#824c45" stroke-width="8" stroke-linecap="round"/>
    <path d="M304 317c27-14 55-14 83-1M414 316c28-13 56-13 83 1" fill="none" stroke="#262b28" stroke-width="11" stroke-linecap="round"/>

    <path d="M70 610c72-56 151-84 240-78l48 268H70zM730 610c-72-56-151-84-240-78l-48 268h288z" fill="url(#jacket)"/>
    <path d="M309 533l91 66-63 62-60-103zM491 533l-91 66 63 62 60-103z" fill="#e4dccb"/>
    <path d="M93 684h165M542 684h165" fill="none" stroke="#686458" stroke-width="6" stroke-linecap="round"/>

    <rect width="800" height="800" fill="url(#scan)"/>
  </g>
  <rect x="24" y="24" width="752" height="752" rx="36" fill="none" stroke="#62ff70" stroke-width="4" opacity=".9"/>
  <path d="M24 110V24h86M690 24h86v86M776 690v86h-86M110 776H24v-86" fill="none" stroke="#62ff70" stroke-width="12" filter="url(#glow)"/>
